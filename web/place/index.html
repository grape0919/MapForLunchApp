<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김대리밥지도</title>
<meta property="og:title" content="김대리밥지도 — 오늘 점심 골라줌">
<meta property="og:description" content="회사 근처 맛집을 룰렛으로 골라주는 앱">
<style>
  body{margin:0;background:#FBF7F0;color:#2A2420;font-family:-apple-system,"Noto Sans KR",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px;width:100%;background:#fff;border:1.5px solid #EDE4D8;border-radius:22px;padding:24px;box-shadow:0 6px 18px rgba(42,36,32,.08)}
  .tile{width:56px;height:56px;border-radius:18px;background:#D9532B;color:#FBF7F0;display:grid;place-items:center;font-size:26px;font-weight:700}
  h1{font-size:28px;margin:16px 0 4px}
  p{color:#7A6F66;margin:0 0 20px;line-height:1.5}
  a.btn{display:block;text-align:center;padding:16px;border-radius:16px;font-weight:700;text-decoration:none;margin-top:8px}
  .primary{background:#D9532B;color:#FBF7F0}
  .secondary{background:#fff;color:#2A2420;border:1.5px solid #EDE4D8}
</style>
</head>
<body>
<div class="card">
  <div class="tile">밥</div>
  <h1 id="name">김대리밥지도</h1>
  <p id="meta">오늘 점심, 또 고민이죠? 룰렛이 골라드립니다.</p>
  <a class="btn primary" id="open" href="#">앱에서 열기</a>
  <a class="btn secondary" id="kakao" href="#">카카오맵에서 보기</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=info.hkdevstudio.gom">Google Play에서 설치</a>
</div>
<script>
  // /place/{id}?n=이름&c=카테고리&a=주소&lat=..&lng=..
  var m = location.pathname.match(/\/place\/([^\/]+)/);
  var id = m ? m[1] : '';
  var q = new URLSearchParams(location.search);
  if (q.get('n')) document.getElementById('name').textContent = q.get('n');
  var meta = [q.get('c'), q.get('a')].filter(Boolean).join(' · ');
  if (meta) document.getElementById('meta').textContent = meta;
  document.getElementById('kakao').href = 'https://place.map.kakao.com/' + id;
  // 앱이 있으면 앱 링크가 가로채고, 없으면 이 페이지가 뜬다. 버튼은 intent:// 로 스토어 폴백.
  var intent = 'intent://place/' + id + location.search + '#Intent;scheme=gom;package=info.hkdevstudio.gom;' +
    'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=info.hkdevstudio.gom') + ';end';
  document.getElementById('open').href = intent;
</script>
</body>
</html>
